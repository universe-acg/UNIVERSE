# Installer routes

homepage:
  path: /
  controller: 'App\Controller\Front\MainController::homepage'

app_installer:
  resource: '../src/Controller/Installer'
  prefix: /install
  name_prefix: 'installer_'
  trailing_slash_on_root: false

fos_user_change_email:
  path: /dashboard/change-email
  controller: 'App\Controller\Api\EmailChangeController::changeEmail'

dashboard_organizer_blog_post_delete:
  path: /dashboard/organizer/manage-blog-posts/{slug}/delete
  controller: 'App\Controller\Dashboard\Organizer\BlogPostController::delete'

dashboard_organizer_blog_post_show:
  path: /dashboard/organizer/manage-blog-posts/{slug}/show
  controller: 'App\Controller\Dashboard\Organizer\BlogPostController::showhide'

dashboard_organizer_blog_post_hide:
  path: /dashboard/organizer/manage-blog-posts/{slug}/hide
  controller: 'App\Controller\Dashboard\Organizer\BlogPostController::showhide'

fos_user_change_username:
  path: /dashboard/change-username
  controller: 'App\Controller\Api\UsernameChangeController::changeUsername'

registration_register_attendee_admin:
  path: /dashboard/administrator/signup/attendee
  controller: 'App\Controller\Dashboard\Administrator\AdminRegistrationController::registerAttendeeAction'

dashboard_administrator_attendees:
  path: /administrator/manage-attendees/{event}
  controller: 'App\Controller\Dashboard\Shared\OrderController::attendeesAdmin'

dashboard_administrator_attendees_details:
  path: /administrator/manage-attendees-details/{eventid}/
  controller: 'App\Controller\Dashboard\Shared\OrderController::attendeesAdminDetails'

dashboard_organizer_attendees_details:
  path: /organizer/manage-attendees-details/{orderid}/{userslug}
  controller: 'App\Controller\Dashboard\Shared\OrderController::attendeesAdminDetailsasOrganizer'

generate_attendees_pdf:
  path: /dashboard/generate-attendees-pdf
  controller: 'App\Controller\Dashboard\Shared\PdfController::generatePdf'

generate_attendees_excel:
  path: /dashboard/generate-attendees-excel
  controller: 'App\Controller\Dashboard\Shared\PdfController::generateExecl'

get_event_details:
  path: '/get-event-details/{eventId}'
  controller: 'App\Controller\Api\EventController::getEventDetails'
  methods: [ 'GET' ]

fos_comment_delete:
  path: '/delete-comment/{id}'
  controller: App\Controller\Front\CommentController::deleteComment
  requirements:
    _format: json  # Restrict the route to respond to JSON requests

dashboard_organizer_blog_post_edit:
  path: '/manage-blog-posts/{slug}/edit'
  controller: App\Controller\Dashboard\Organizer\BlogPostController::addedit

dashboard_administrator_blog_post_edit:
  path: '/manage-blog-posts-admin/{slug}/edit'
  controller: App\Controller\Dashboard\Administrator\BlogPostController::addeditadmin

dashboard_organizer_event_delete_permanently_admin:
  path: '/administrator/my-events/{slug}/delete-permanently-admin'
  controller: App\Controller\Dashboard\Shared\EventController::deleteforadmin

dashboard_organizer_profile_admin:
  path: '/profile/{id}'
  controller: 'App\Controller\Dashboard\Organizer\AccountController::editOrganizerAsAdmin'
  methods: [ 'GET', 'POST' ]

dashboard_edit_user:
  path: '/administrator/edit/user/{id}'
  controller: 'App\Controller\Dashboard\Administrator\UserController::edituser'
  methods: [ 'GET', 'POST' ]

attendee_attendeed_x_events:
  path: '/attendee/statistics/{attendeeid}'
  controller: 'App\Controller\Dashboard\Organizer\AccountController::editOrganizerAsAdmin'
  methods: [ 'GET' ]

#admin_statistics:
#  path: '/admin/statistics/{attendeeid}'
#  controller: 'App\Controller\Dashboard\Organizer\AccountController::editOrganizerAsAdmin'
#  methods: [ 'GET' ]
#
#admin_statistics:
#  path: '/admin/statistics/'
#  controller: 'App\Controller\Dashboard\Organizer\AccountController::editOrganizerAsAdmin'
#  methods: [ 'GET' ]

organizer_statistics:
  path: '/profile/'
  controller: 'App\Controller\Dashboard\Organizer\AccountController::editOrganizerAsAdmin'
  methods: [ 'GET' ]

registration_register_organizer_admin:
  path: /dashboard/administrator/signup/organizer
  controller: 'App\Controller\Dashboard\Administrator\AdminRegistrationController::registerOrganizerAction'

blog_post_category_add:
  path: /dashboard/organizer/manage-blog-post-categories/add
  controller: 'App\Controller\Dashboard\Organizer\BlogPostCategoryController::addedit'
  methods: [ 'GET', 'POST' ]

blog_post_organizer:
  path: /dashboard/organizer/manage-blog-posts-organizer/
  controller: 'App\Controller\Dashboard\Organizer\BlogPostController::index'
  methods: [ 'GET', 'POST' ]

# Dashboard routes
dashboard_attendee_following:
  path: /dashboard/attendee/following
  controller: 'App\Controller\Dashboard\Attendee\FollowingController::index'
  methods: [ 'GET' ]

  trailing_slash_on_root: false

dashboard_attendee_bookevent:
  path: /dashboard/attendee/bookevent/{reference}
  controller: 'App\Controller\Dashboard\Shared\CartController::bookevent'
  methods: [ GET ]
  
  trailing_slash_on_root: false

app_dashboard_attendee_following_add:
  path: /dashboard/attendee/following/add/{slug}
  controller: 'App\Controller\Dashboard\Attendee\FollowingController::addRemove'
  methods: [ 'GET' ]
  condition: 'request.isXmlHttpRequest()'
  
  trailing_slash_on_root: false

app_dashboard_attendee_following_remove:
  path: /dashboard/attendee/following/remove/{slug}
  controller: 'App\Controller\Dashboard\Attendee\FollowingController::addRemove'
  methods: [ 'GET' ]
  condition: 'request.isXmlHttpRequest()'
  
  trailing_slash_on_root: false

# Dashboard routes
favorites_add:
  path: /dashboard/attendee/my-favorites/add/{slug}
  controller: 'App\Controller\Dashboard\Attendee\FavoritesController::addRemove'
  methods: [ 'GET' ]
  condition: 'request.isXmlHttpRequest()'
  
  trailing_slash_on_root: false

favorites_remove:
  path: /dashboard/attendee/my-favorites/remove/{slug}
  controller: 'App\Controller\Dashboard\Attendee\FavoritesController::addRemove'
  methods: [ 'GET' ]
  condition: 'request.isXmlHttpRequest()'
  
  trailing_slash_on_root: false

app_dashboard_main:
  resource: '../src/Controller/Dashboard/Main'
  prefix: /dashboard
  name_prefix: 'dashboard_'
  
  trailing_slash_on_root: false

app_dashboard_admin:
  resource: '../src/Controller/Dashboard/Administrator'
  prefix: /dashboard/administrator
  name_prefix: 'dashboard_administrator_'
  
  trailing_slash_on_root: false

app_dashboard_organizer:
  resource: '../src/Controller/Dashboard/Organizer'
  prefix: /dashboard/organizer
  name_prefix: 'dashboard_organizer_'
  
  trailing_slash_on_root: false

# Change the shared controller name prefixes manually
app_dashboard_shared:
  resource: '../src/Controller/Dashboard/Shared'
  prefix: /dashboard
  
  trailing_slash_on_root: false

app_dashboard_attendee:
  resource: '../src/Controller/Dashboard/Attendee'
  prefix: /dashboard/attendee
  name_prefix: 'dashboard_attendee_'
  
  trailing_slash_on_root: false

app_dashboard_point_of_sale:
  resource: '../src/Controller/Dashboard/PointOfSale'
  prefix: /dashboard/pointofsale
  name_prefix: 'dashboard_pointofsale_'
  
  trailing_slash_on_root: false

# Front routes

app_front:
  resource: '../src/Controller/Front'
  prefix: /
  
  trailing_slash_on_root: false

# Api routes

app_api:
  resource: '../src/Controller/Api'
  prefix: /api/
  
  trailing_slash_on_root: false

# Bundles routes

JMSTranslationBundle_ui:
  resource: "@JMSTranslationBundle/Controller/"
  type: annotation
  prefix: /

fos_user:
  resource: 'routes/fos_user/'
  type: directory
  prefix: /
  
  trailing_slash_on_root: false

fos_js_routing:
  resource: "@FOSJsRoutingBundle/Resources/config/routing/routing-sf4.xml"

payum_all:
  resource: "@PayumBundle/Resources/config/routing/all.xml"

presta_sitemap:
  resource: "@PrestaSitemapBundle/Resources/config/routing.yml"

rss_atom_bundle:
  resource: "@DebrilRssAtomBundle/Resources/config/routing.yml"

_liip_imagine:
  resource: "@LiipImagineBundle/Resources/config/routing.yaml"

bazinga_js_translation:
  resource: "@BazingaJsTranslationBundle/Resources/config/routing/routing.yml"

fos_comment_api:
  type: rest
  resource: "@FOSCommentBundle/Resources/config/routing.yml"
  prefix: /api
  defaults: { _format: html }

hwi_oauth_redirect:
  resource: "@HWIOAuthBundle/Resources/config/routing/redirect.xml"
  prefix: /connect

hwi_oauth_connect:
  resource: "@HWIOAuthBundle/Resources/config/routing/connect.xml"
  prefix: /connect

hwi_oauth_login:
  resource: "@HWIOAuthBundle/Resources/config/routing/login.xml"
  prefix: /login

facebook_login:
  path: /login/check-facebook

google_login:
  path: /login/check-google

qr_reader:
  path: /scanqr
  controller: App\Controller\Api\QrReaderController::qrReader

api_handle_post_request:
  path: /api/handle-post-request
  controller: App\Controller\Api\QrReaderController::handlePostRequest
  methods: POST
