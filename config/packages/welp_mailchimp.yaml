welp_mailchimp:
  api_key: '%env(MAILCHIMP_API_KEY)%'
  lists:
    '%env(MAILCHIMP_LIST_ID)%':
      subscriber_provider: 'universe_mailchimp_fos_subscriber_provider'
      merge_fields:
        - tag: FNAME
          name: First Name
          type: text
          public: true
        - tag: LNAME
          name: Last Name
          type: text
          public: true