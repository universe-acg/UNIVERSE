security:
  password_hashers:
    App\Entity\User: { algorithm: auto }
  role_hierarchy:
    ROLE_ADMINISTRATOR: [ROLE_ADMIN, ROLE_USER, ROLE_ALLOWED_TO_SWITCH]
    ROLE_ORGANIZER: ROLE_USER
    ROLE_ATTENDEE: ROLE_USER
  providers:
    app_users: { id: App\Security\NativeUserProvider }
  firewalls:
    dev: { pattern: '^/(_(profiler|wdt)|assets|media)/', security: false }
    main:
      lazy: true
      provider: app_users
      user_checker: App\Security\UserChecker
      form_login:
        login_path: fos_user_security_login
        check_path: fos_user_security_check
        enable_csrf: true
        default_target_path: dashboard_index
      logout: { path: fos_user_security_logout, target: homepage, enable_csrf: true }
      remember_me: { secret: '%kernel.secret%', lifetime: 2592000 }
      login_throttling: { max_attempts: 5 }
  access_control:
    - { path: '^/(signin|login|signup|resetting|assets|media|health)', roles: PUBLIC_ACCESS }
    - { path: '^/dashboard/administrator', roles: ROLE_ADMINISTRATOR }
    - { path: '^/(administrator|manage-)', roles: ROLE_ADMINISTRATOR }
    - { path: '^/dashboard/organizer', roles: ROLE_ORGANIZER }
    - { path: '^/(dashboard|notifications|chat|download|api)', roles: ROLE_USER }
