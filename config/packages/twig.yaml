twig:
  paths:
    '%kernel.project_dir%/templates/bundles/FOSCommentBundle': FOSComment
  default_path: '%kernel.project_dir%/templates'
  strict_variables: '%kernel.debug%'
  form_themes: ['Global/bootstrap-4-forms-layout.html.twig']
  date: { format: '%date_format%', timezone: '%date_timezone%' }
  globals:
    equalweb_site_key: '%env(EQUALWEB_SITE_KEY)%'
    services: '@App\Service\AppServices'
    google_maps_api_key: '%google_maps_api_key%'
    date_format: '%date_format%'
    date_format_date_only: '%date_format_date_only%'
    date_timezone: '%date_timezone%'
