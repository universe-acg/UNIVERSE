parameters:
  locale: en
  date_timezone: Europe/Athens
  date_format: 'd M Y H:i'
  date_format_simple: 'd/m/Y'
  date_format_date_only: 'd M Y'
  is_website_configured: true
  maintenance_mode: false
  website_name: 'UNIVERSE | Deree Demo'
  no_reply_email: 'noreply@universe.example.test'
  website_root_url: '%env(APP_URL)%'
  google_maps_api_key: ''
  google_recaptcha_site_key: ''
services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind: { $accountSid: '', $authToken: '' }
  App\:
    resource: '../src/'
    exclude: '../src/{Entity,Model,Migrations,Kernel.php,Controller/Installer,Controller/bundles,Security/FOSUBUserProvider.php,Security/TokenAuthenticator.php,Feed}'
  App\Controller\:
    resource: '../src/Controller/'
    exclude: '../src/Controller/{Installer,bundles}'
    tags: ['controller.service_arguments']
  app.services: '@App\Service\AppServices'
  Symfony\Component\HttpFoundation\Session\SessionInterface:
    factory: ['@request_stack', 'getSession']
  App\Service\DemoMailer:
    arguments: { $logDirectory: '%kernel.logs_dir%/delivery' }

  Symfony\Component\Cache\Adapter\AdapterInterface: "@cache.app"
  Symfony\Component\Routing\Matcher\UrlMatcherInterface: "@router"
